name: CI

# T-191 (2026-09-02) — gates automatisés. Leçon T-187/188/189 :
# smoke et vitest ne doivent JAMAIS tourner sur la même base. Ici :
#   - vitest  → service postgres:16 (base app_db_ci, port 5432)
#   - smoke   → son propre Postgres embarqué (base app_db, port 55432),
#               démarré par smoke.sh lui-même (autonome, fait db:push+seed)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # Base DÉDIÉE à vitest (jamais partagée avec le smoke).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      JWT_SECRET: ci-secret-64chars-ci-only-0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ALLOW_MOCK_PAYMENTS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (0 erreur / 0 warning exigé depuis T-189)
        run: npx eslint src --max-warnings 0

      - name: Garde-fou i18n
        run: npm run i18n:check

      - name: Garde-fou framework .ai
        run: npm run ai:check

      - name: Schéma sur la base de tests dédiée (vitest)
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db_ci

      - name: Tests unitaires + intégration (vitest)
        run: npx vitest run
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db_ci

      - name: Build production
        run: npx next build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db_ci

      - name: Pré-chauffer le Postgres embarqué du smoke
        # smoke.sh n'attend :55432 que 30 s ; le 1er run CI fait un initdb
        # complet (le binaire vient déjà de npm ci). Pré-démarrage avec une
        # fenêtre plus confortable + diagnostic sur échec.
        run: |
          setsid npm run db:dev > /tmp/ci-db.log 2>&1 &
          for i in $(seq 1 240); do
            (echo > /dev/tcp/127.0.0.1/55432) 2>/dev/null && break
            sleep 1
          done
          (echo > /dev/tcp/127.0.0.1/55432) 2>/dev/null || { tail -40 /tmp/ci-db.log; exit 1; }

      - name: Smoke HTTP (base embedded dédiée, seed inclus)
        run: npm run smoke

      - name: Arrêter le Postgres embarqué
        if: always()
        run: pkill -f "embedded-postgres" || true
